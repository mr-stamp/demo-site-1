<!DOCTYPE html>
<html>
  <head>
    <title>My Page Title</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&family=Edu+AU+VIC+WA+NT+Hand:wght@400..700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="gheader"></div>
    <script src="/demo-site-1/global-header.js"></script>
    
    <img id="bg" src="/demo-site-1/resource/bg.png">
    <div class="bordered">
      <h2 class="heading">✖️➕➖➗Welcome<span id="userspan"></span> to Mr. Stamp's site✖️➕➖➗</h2>
    </div>
    <hr>

    <script>
      let urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has("variable1")) {
        let username = urlParams.get("variable1");
        let userspan = document.getElementById("userspan");
        userspan.innerText = ", " + username + ",";
      }
    </script>
  </body>
</html>
